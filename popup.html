<!DOCTYPE html>
<html>

<head>
    <title>Solve2Git</title>
</head>

<body>

    <h2>Solve2Git</h2>

    <label>
        GitHub Username
    </label>

    <input
        id="username"
        type="text"
        placeholder="prem-kumar3405"
    >

    <br><br>

    <label>
        Repository
    </label>

    <input
        id="repository"
        type="text"
        placeholder="Leetcode_problems"
    >

    <br><br>

    <label>
        GitHub Token
    </label>

    <input
        id="token"
        type="password"
        placeholder="github_pat_..."
    >

    <br><br>

    <button id="saveButton">
        Save Settings
    </button>

    <button id="testButton">
        Test GitHub Connection
    </button>
    <button id="writeTestButton">
    Test GitHub Write
    </button>

    <p id="status"></p>

    <script src="popup.js"></script>

</body>

</html>
